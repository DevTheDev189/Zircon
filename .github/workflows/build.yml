name: Build and Package (Multi-Platform)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release with build artifacts"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # CurseForge Building Key for server modpack downloads & catalog resolution
  CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

jobs:
  # ---------------------------------------------------------------------------
  # Windows Build: Zircon Server (zip) + Zircon Launcher (NSIS exe, WiX msi)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows (Server & Launcher)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: crates/zircon-launcher/ui/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-windows"

      - name: Build Vue UI frontend
        working-directory: crates/zircon-launcher/ui
        run: |
          npm ci
          npm run build

      - name: Build Zircon Server (Release)
        run: |
          cargo build --release -p zircon-server

      - name: Package Zircon Server
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist-run/zircon-server"
          Copy-Item "target/release/zircon-server.exe" -Destination "dist-run/zircon-server/"
          Copy-Item "crates/zircon-server/deploy/start-server.bat" -Destination "dist-run/zircon-server/"
          Copy-Item "crates/zircon-server/deploy/README.txt" -Destination "dist-run/zircon-server/"
          Copy-Item "LICENSE" -Destination "dist-run/zircon-server/"
          Compress-Archive -Path "dist-run/zircon-server/*" -DestinationPath "dist-run/zircon-server-windows-x86_64.zip" -Force
          $hash = (Get-FileHash -Path "dist-run/zircon-server-windows-x86_64.zip" -Algorithm SHA256).Hash
          "$hash  zircon-server-windows-x86_64.zip" | Out-File -FilePath "dist-run/zircon-server-windows-x86_64.zip.sha256" -Encoding ascii
          Write-Host "Server packaged: dist-run/zircon-server-windows-x86_64.zip (SHA256: $hash)"

      - name: Check Microsoft Azure Code Signing Key
        id: azure-sign-check
        shell: pwsh
        env:
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:AZURE_KEY_VAULT_URI) -and -not [string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID)) {
            Write-Host "Microsoft Azure developer key detected — code signing will be performed."
            echo "has_azure_key=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No Microsoft Azure signing credentials detected. Skipping Windows code signing."
            echo "has_azure_key=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build Zircon Launcher (NSIS & MSI)
        working-directory: crates/zircon-launcher
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Host "Tauri updater signing key detected — generating signed updater artifacts."
            npx --yes @tauri-apps/cli build --bundles nsis,msi
          } else {
            Write-Host "Tauri updater key not detected — building without updater signature artifacts."
            npx --yes @tauri-apps/cli build --bundles nsis,msi --config '{"bundle":{"createUpdaterArtifacts":false}}'
          }

      - name: Sign Windows Binaries with Azure (Optional)
        if: steps.azure-sign-check.outputs.has_azure_key == 'true'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
        run: |
          Write-Host "Executing Azure Trusted Signing on Windows bundle artifacts..."
          # Azure signing placeholder / integration hook:
          # dotnet tool install --global Azure.CodeSigning.Dlib
          # or azuresigntool sign -kvu $env:AZURE_KEY_VAULT_URI -kvi $env:AZURE_CLIENT_ID -kvs $env:AZURE_CLIENT_SECRET -kvc $env:AZURE_CERT_NAME ...

      - name: Stage Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts-windows"
          Copy-Item "dist-run/zircon-server-windows-x86_64.zip*" -Destination "artifacts-windows/"
          Get-ChildItem -Path "target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Copy-Item -Destination "artifacts-windows/"
          Get-ChildItem -Path "target/release/bundle/nsis/*.sig" -ErrorAction SilentlyContinue | Copy-Item -Destination "artifacts-windows/"
          Get-ChildItem -Path "target/release/bundle/nsis/*.zip" -ErrorAction SilentlyContinue | Copy-Item -Destination "artifacts-windows/"
          Get-ChildItem -Path "target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Copy-Item -Destination "artifacts-windows/"
          Get-ChildItem -Path "target/release/bundle/msi/*.sig" -ErrorAction SilentlyContinue | Copy-Item -Destination "artifacts-windows/"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zircon-windows-x86_64
          path: artifacts-windows/*

  # ---------------------------------------------------------------------------
  # Linux Build: Zircon Server (tar.gz) + Zircon Launcher (.deb, .AppImage)
  # ---------------------------------------------------------------------------
  build-linux:
    name: Linux (Server & Launcher)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: crates/zircon-launcher/ui/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            rpm \
            zip
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-linux"

      - name: Build Vue UI frontend
        working-directory: crates/zircon-launcher/ui
        run: |
          npm ci
          npm run build

      - name: Build Zircon Server (Linux Release)
        run: |
          cargo build --release -p zircon-server

      - name: Package Zircon Server
        run: |
          mkdir -p dist-run/zircon-server
          cp target/release/zircon-server dist-run/zircon-server/
          chmod +x dist-run/zircon-server/zircon-server
          cp crates/zircon-server/deploy/start-server.sh dist-run/zircon-server/
          chmod +x dist-run/zircon-server/start-server.sh
          cp crates/zircon-server/deploy/zircon-server.service dist-run/zircon-server/
          cp crates/zircon-server/deploy/README.txt dist-run/zircon-server/
          cp LICENSE dist-run/zircon-server/
          tar -czvf dist-run/zircon-server-linux-x86_64.tar.gz -C dist-run/zircon-server .
          sha256sum dist-run/zircon-server-linux-x86_64.tar.gz > dist-run/zircon-server-linux-x86_64.tar.gz.sha256
          (cd dist-run/zircon-server && zip -r ../zircon-server-linux-x86_64.zip .)
          sha256sum dist-run/zircon-server-linux-x86_64.zip > dist-run/zircon-server-linux-x86_64.zip.sha256
          echo "Linux Server packaged: tar.gz and zip"

      - name: Build Zircon Launcher (.deb, .AppImage, .rpm)
        working-directory: crates/zircon-launcher
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Tauri updater signing key detected — generating signed updater artifacts."
            npx --yes @tauri-apps/cli build --bundles deb,appimage,rpm
          else
            echo "Tauri updater key not detected — building without updater signature artifacts."
            npx --yes @tauri-apps/cli build --bundles deb,appimage,rpm --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Stage Linux Artifacts
        run: |
          mkdir -p artifacts-linux
          cp dist-run/zircon-server-linux-x86_64.* artifacts-linux/
          find target/release/bundle/deb/ -type f -name "*.deb" -exec cp {} artifacts-linux/ \; 2>/dev/null || true
          find target/release/bundle/appimage/ -type f -name "*.AppImage" -exec cp {} artifacts-linux/ \; 2>/dev/null || true
          find target/release/bundle/rpm/ -type f -name "*.rpm" -exec cp {} artifacts-linux/ \; 2>/dev/null || true
          find target/release/bundle/ -type f -name "*.sig" -exec cp {} artifacts-linux/ \; 2>/dev/null || true
          find target/release/bundle/ -type f -name "*.tar.gz" -exec cp {} artifacts-linux/ \; 2>/dev/null || true

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zircon-linux-x86_64
          path: artifacts-linux/*

  # ---------------------------------------------------------------------------
  # macOS Build: Zircon Launcher (.dmg & .app)
  # ---------------------------------------------------------------------------
  build-macos:
    name: macOS (Launcher)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: crates/zircon-launcher/ui/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-macos"

      - name: Build Vue UI frontend
        working-directory: crates/zircon-launcher/ui
        run: |
          npm ci
          npm run build

      - name: Check Apple Developer Code Signing Keys
        id: apple-sign-check
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Apple Developer certificate detected — preparing signing keychain."
            echo "has_apple_key=true" >> $GITHUB_OUTPUT
          else
            echo "No Apple Developer certificate detected. Skipping macOS code signing and notarization (ad-hoc signing will be used)."
            echo "has_apple_key=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Apple Signing Keychain (Optional)
        if: steps.apple-sign-check.outputs.has_apple_key == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERTIFICATE_P12=$RUNNER_TEMP/certificate.p12
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_P12"
          security import "$CERTIFICATE_P12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> $GITHUB_ENV
          if [ -n "$APPLE_ID" ]; then echo "APPLE_ID=$APPLE_ID" >> $GITHUB_ENV; fi
          if [ -n "$APPLE_PASSWORD" ]; then echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> $GITHUB_ENV; fi
          if [ -n "$APPLE_TEAM_ID" ]; then echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> $GITHUB_ENV; fi

      - name: Build Zircon Launcher (.dmg & .app)
        working-directory: crates/zircon-launcher
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Tauri updater signing key detected — generating signed updater artifacts."
            npx --yes @tauri-apps/cli build --bundles dmg,app
          else
            echo "Tauri updater key not detected — building without updater signature artifacts."
            npx --yes @tauri-apps/cli build --bundles dmg,app --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Archive macOS .app bundle
        run: |
          mkdir -p artifacts-macos
          # Copy .dmg
          find target/release/bundle/dmg/ -type f -name "*.dmg" -exec cp {} artifacts-macos/ \; 2>/dev/null || true
          find target/release/bundle/ -type f -name "*.sig" -exec cp {} artifacts-macos/ \; 2>/dev/null || true
          find target/release/bundle/ -type f -name "*.tar.gz" -exec cp {} artifacts-macos/ \; 2>/dev/null || true
          # Compress .app directory for easy distribution
          if [ -d target/release/bundle/macos/Zircon.app ]; then
            tar -czvf artifacts-macos/Zircon-macOS-app.tar.gz -C target/release/bundle/macos Zircon.app
          fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zircon-macos
          path: artifacts-macos/*

  # ---------------------------------------------------------------------------
  # Release Job: Publishes release on tag push (v*) or manual dispatch trigger
  # ---------------------------------------------------------------------------
  release:
    name: Publish Release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten release assets
        run: |
          mkdir -p release-dist
          find release-assets/ -type f -exec cp {} release-dist/ \;
          ls -la release-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Extract Release Version
        id: get-version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=0.4.7" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloudflare Pages & R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          RELEASE_VERSION: ${{ steps.get-version.outputs.version }}
          RELEASE_ASSETS_DIR: release-dist
        run: |
          python3 scripts/ci_deploy_cloudflare.py
