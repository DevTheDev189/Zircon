ShortDescription: Free, open-source Minecraft launcher with sub-second cryptographic mod sync and 4-player couch co-op.
Description: |
  Zircon is a high-performance open-source companion launcher for modded Minecraft built in Rust and Tauri 2.
  It automatically synchronizes exact server mods using cryptographic Bill of Materials (BOM) verification against Modrinth and CurseForge,
  features native 4-player split-screen couch co-op with gamepad support, 3D skin studio, and 1-click universal migration from CurseForge and Prism.
