dependencies {
    api 'com.google.code.gson:gson:2.10.1'
    api 'org.slf4j:slf4j-api:2.0.12'

    // TOML parsing for Forge (META-INF/mods.toml) and NeoForge
    // (META-INF/neoforge.mods.toml) mod metadata files.
    implementation 'org.tomlj:tomlj:1.1.1'

    // TAR + LZ4 frame compression for server-side instance backups
    // (AGENT_PLAN_6: Lz4ArchiveUtil). Note: lz4-java 1.8.0 publishes under
    // the org.lz4 group even though its Java packages stay net.jpountz.lz4.*.
    implementation 'org.lz4:lz4-java:1.8.0'
    implementation 'org.apache.commons:commons-compress:1.26.1'
}
