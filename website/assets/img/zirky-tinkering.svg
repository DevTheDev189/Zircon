<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Brand Cyan Ambient Backdrop -->
    <radialGradient id="tinker-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#0f766e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#05080e" stop-opacity="0" />
    </radialGradient>

    <!-- Obsidian Chassis Gradients -->
    <linearGradient id="chassis-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="chassis-head" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="35%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b111e" />
    </linearGradient>

    <!-- Ear Module Gradients -->
    <linearGradient id="ear-l-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="ear-r-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="thruster-pill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="screen-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#03141c" />
    </linearGradient>

    <!-- Screen Clipping Path -->
    <clipPath id="screen-clip">
      <rect x="108" y="86" width="104" height="74" rx="14" />
    </clipPath>

    <!-- Glowing Zircon Cyan Filters -->
    <filter id="zircon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="title-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .tinker-hover {
      animation: tinkerHover 3s ease-in-out infinite alternate;
    }
    .head-sway {
      animation: headSway 3.8s ease-in-out infinite alternate;
    }
    .hand-tinker-l {
      animation: handTinkerL 2.8s ease-in-out infinite alternate;
    }
    .hand-tinker-r {
      animation: handTinkerR 2.8s ease-in-out infinite alternate -1.3s;
    }
    .term-scroll {
      animation: streamDown 3.2s linear infinite;
    }
    .term-title {
      animation: titlePulse 2.2s ease-in-out infinite alternate;
    }
    .overclock-pulse {
      animation: overclockShine 1.6s ease-in-out infinite alternate;
    }
    .jet-flicker {
      animation: jetFlicker 1.5s ease-in-out infinite alternate;
    }

    @keyframes tinkerHover {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes headSway {
      0% { transform: rotate(-3.5deg); }
      50% { transform: rotate(0.5deg); }
      100% { transform: rotate(4deg); }
    }
    @keyframes handTinkerL {
      0% { transform: translateY(0px) rotate(-3deg); }
      35% { transform: translateY(-6px) rotate(1deg); }
      70% { transform: translateY(-2px) rotate(-4deg); }
      100% { transform: translateY(-8px) rotate(3deg); }
    }
    @keyframes handTinkerR {
      0% { transform: translateY(-7px) rotate(4deg); }
      40% { transform: translateY(1px) rotate(-1deg); }
      75% { transform: translateY(-9px) rotate(5deg); }
      100% { transform: translateY(-2px) rotate(-3deg); }
    }
    @keyframes streamDown {
      0% { transform: translateY(-44px); }
      100% { transform: translateY(36px); }
    }
    @keyframes titlePulse {
      0% { opacity: 0.92; filter: drop-shadow(0 0 2px #2dd4bf); }
      100% { opacity: 1; filter: drop-shadow(0 0 9px #5eead4) drop-shadow(0 0 16px #2dd4bf); }
    }
    @keyframes overclockShine {
      0% { opacity: 0.8; filter: drop-shadow(0 0 2px #2dd4bf); }
      100% { opacity: 1; filter: drop-shadow(0 0 10px #5eead4); }
    }
    @keyframes jetFlicker {
      0% { transform: scaleY(0.9) scaleX(0.95); opacity: 0.85; }
      100% { transform: scaleY(1.1) scaleX(1.05); opacity: 1; }
    }
  </style>

  <!-- Ambient Backdrop Glow -->
  <circle cx="160" cy="155" r="140" fill="url(#tinker-glow)" />

  <!-- Clean Ground Shadow -->
  <ellipse cx="160" cy="288" rx="46" ry="6" fill="#020617" opacity="0.5" />

  <!-- Main Floating Character Rig -->
  <g class="tinker-hover">

    <!-- LAYER 1: Rocket Flame Plume (Rendered BEHIND the rocket cone) -->
    <g class="jet-flicker" transform-origin="160 244">
      <polygon points="148,242 160,277 172,242" fill="#2dd4bf" filter="url(#zircon-glow)" opacity="0.9" />
      <polygon points="152,242 160,267 168,242" fill="#5eead4" />
      <polygon points="155,242 160,258 165,242" fill="#ffffff" />
      <circle cx="155" cy="279" r="1.6" fill="#5eead4" opacity="0.8" />
      <circle cx="165" cy="281" r="1.4" fill="#2dd4bf" opacity="0.9" />
    </g>

    <!-- LAYER 2: Rocket Thruster Cone Piece (Rendered IN FRONT OF Flame, BEHIND Torso) -->
    <g id="thruster-cone-piece">
      <rect x="141" y="232" width="38" height="15" rx="5" fill="url(#thruster-pill)" stroke="rgba(45, 212, 191, 0.45)" stroke-width="1.5" />
    </g>

    <!-- LAYER 3: Torso Chassis (Rendered IN FRONT OF Thruster Cone) -->
    <g id="torso">
      <rect x="122" y="179" width="76" height="59" rx="14" fill="url(#chassis-body)" stroke="rgba(45, 212, 191, 0.45)" stroke-width="2" />

      <!-- Chest Reactor Housing Plate with Glowing Zircon Cyan Border -->
      <rect x="142" y="191" width="36" height="34" rx="8" fill="#031b22" stroke="#2dd4bf" stroke-width="1.8" filter="url(#zircon-glow)" />
      
      <!-- Rapid Processing Zircon Z Icon -->
      <g class="overclock-pulse" transform="translate(160, 208) scale(0.44) translate(-32, -32)" filter="url(#zircon-glow)">
        <path
           d="M 10.73489,12.12731 v 11.06289 h 4.615739 l 3.522265,-4.46794 h 17.74052 v 5.34179 l -25.864055,16.18351 v 11.62513 h 42.511617 v -12.93668 h -4.618839 l -3.52485,4.47053 H 27.401056 v -3.15898 l 25.864054,-16.18351 v -11.93674 H 13.462372 Z"
           fill="#2dd4bf"
           stroke="#5eead4"
           stroke-width="1.2"
           stroke-linejoin="round" />
      </g>

      <!-- Chassis Accent Circuits (Glowing Zircon Cyan) -->
      <line x1="129" y1="195" x2="136" y2="195" stroke="#2dd4bf" stroke-width="1.5" opacity="0.8" stroke-linecap="round" />
      <line x1="129" y1="201" x2="134" y2="201" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
      <line x1="184" y1="195" x2="191" y2="195" stroke="#2dd4bf" stroke-width="1.5" opacity="0.8" stroke-linecap="round" />
      <line x1="186" y1="201" x2="191" y2="201" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
    </g>

    <!-- LAYER 4: Deliberate Fluid Tinkering Hands (Slower & Clean) -->
    <g class="hand-tinker-l" id="hand-left" transform-origin="84 195" filter="url(#soft-shadow)">
      <rect x="70" y="180" width="28" height="28" rx="8" fill="url(#chassis-body)" stroke="rgba(45, 212, 191, 0.5)" stroke-width="2" />
      <rect x="76" y="186" width="16" height="16" rx="4" fill="#041b24" />
      <circle cx="84" cy="194" r="3.5" fill="#2dd4bf" filter="url(#zircon-glow)" />
    </g>

    <g class="hand-tinker-r" id="hand-right" transform-origin="236 195" filter="url(#soft-shadow)">
      <rect x="222" y="180" width="28" height="28" rx="8" fill="url(#chassis-body)" stroke="rgba(45, 212, 191, 0.5)" stroke-width="2" />
      <rect x="228" y="186" width="16" height="16" rx="4" fill="#041b24" />
      <circle cx="236" cy="194" r="3.5" fill="#2dd4bf" filter="url(#zircon-glow)" />
    </g>

    <!-- LAYER 5: Floating Head with Subtle Head Sway & Full-Visor Terminal Screen -->
    <g class="head-sway" id="head" transform-origin="160 122" filter="url(#soft-shadow)">
      
      <!-- Left D-Shaped Ear -->
      <g id="ear-left">
        <path d="M 94 105 L 87 105 Q 80 105 80 112 L 80 130 Q 80 137 87 137 L 94 137 Z" fill="url(#ear-l-grad)" stroke="rgba(45, 212, 191, 0.45)" stroke-width="1.5" stroke-linejoin="round" />
        <path d="M 94 109 L 88 109 Q 83 109 83 114 L 83 128 Q 83 133 88 133 L 94 133 Z" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.8" />
      </g>

      <!-- Right D-Shaped Ear -->
      <g id="ear-right">
        <path d="M 226 105 L 233 105 Q 240 105 240 112 L 240 130 Q 240 137 233 137 L 226 137 Z" fill="url(#ear-r-grad)" stroke="rgba(45, 212, 191, 0.45)" stroke-width="1.5" stroke-linejoin="round" />
        <path d="M 226 109 L 232 109 Q 237 109 237 114 L 237 128 Q 237 133 232 133 L 226 133 Z" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.8" />
      </g>

      <!-- Main Head Chassis -->
      <rect x="94" y="68" width="132" height="106" rx="20" fill="url(#chassis-head)" stroke="rgba(45, 212, 191, 0.45)" stroke-width="2.2" />

      <!-- Visor Face Screen Base -->
      <rect x="108" y="86" width="104" height="74" rx="14" fill="url(#screen-bg)" stroke="#1e293b" stroke-width="1.5" />
      
      <!-- BACKGROUND: Scrolling Darker Terminal Code Lines (Top to Bottom) -->
      <g clip-path="url(#screen-clip)">
        <g class="term-scroll" fill="#0b3842" opacity="0.7">
          <!-- Pattern row 1 -->
          <rect x="114" y="52" width="34" height="2.5" rx="1.2" />
          <rect x="154" y="52" width="26" height="2.5" rx="1.2" />
          <rect x="114" y="62" width="52" height="2.5" rx="1.2" />
          <rect x="172" y="62" width="18" height="2.5" rx="1.2" />
          <rect x="114" y="72" width="28" height="2.5" rx="1.2" />
          <rect x="148" y="72" width="42" height="2.5" rx="1.2" />
          <rect x="114" y="82" width="60" height="2.5" rx="1.2" />
          <rect x="114" y="92" width="36" height="2.5" rx="1.2" />
          <rect x="156" y="92" width="24" height="2.5" rx="1.2" />
          <rect x="114" y="102" width="46" height="2.5" rx="1.2" />
          <rect x="166" y="102" width="22" height="2.5" rx="1.2" />
          <rect x="114" y="112" width="58" height="2.5" rx="1.2" />
          <rect x="114" y="122" width="30" height="2.5" rx="1.2" />
          <rect x="150" y="122" width="38" height="2.5" rx="1.2" />
          <rect x="114" y="132" width="48" height="2.5" rx="1.2" />
          <rect x="168" y="132" width="16" height="2.5" rx="1.2" />
          <rect x="114" y="142" width="36" height="2.5" rx="1.2" />
          <rect x="156" y="142" width="32" height="2.5" rx="1.2" />
          <rect x="114" y="152" width="54" height="2.5" rx="1.2" />
          <rect x="114" y="162" width="40" height="2.5" rx="1.2" />
          <rect x="160" y="162" width="26" height="2.5" rx="1.2" />
          <rect x="114" y="172" width="50" height="2.5" rx="1.2" />
        </g>
      </g>

      <!-- Visor Vignette Shadow (Softens center behind text) -->
      <ellipse cx="160" cy="123" rx="44" ry="18" fill="#020810" opacity="0.65" clip-path="url(#screen-clip)" />

      <!-- FOREGROUND: Large, Bright Glowing "TINKERING" Taking Up Screen Width -->
      <g class="term-title" filter="url(#title-glow)">
        <text x="160" y="127" text-anchor="middle" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="12.5" font-weight="900" fill="#5eead4" letter-spacing="1.2">TINKERING</text>
        <text x="160" y="127" text-anchor="middle" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="12.5" font-weight="900" fill="#ffffff" letter-spacing="1.2" opacity="0.75">TINKERING</text>
      </g>

      <!-- Terminal Top & Bottom Status Markers -->
      <g opacity="0.5" clip-path="url(#screen-clip)">
        <text x="116" y="99" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="700" fill="#2dd4bf" letter-spacing="0.5">&gt; ZIRCON_SYS</text>
        <text x="204" y="99" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="700" fill="#5eead4">ACTIVE</text>
        <rect x="116" y="148" width="88" height="1.5" rx="0.7" fill="#0b3842" />
        <rect x="116" y="148" width="56" height="1.5" rx="0.7" fill="#2dd4bf" opacity="0.75" />
      </g>

      <!-- Visor Gloss Sheen Curve -->
      <path d="M 112 90 L 198 90 Q 206 90 206 98 L 206 104 L 112 90 Z" fill="rgba(255, 255, 255, 0.08)" />

    </g>

  </g>
</svg>
