<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Server on Zircon — Modded Minecraft</title>
  <meta name="description" content="Click to launch and automatically connect to this modded Minecraft server via Zircon Launcher.">
  <meta name="theme-color" content="#070b0f">
  <link rel="icon" type="image/svg+xml" href="assets/img/zircon-icon.svg">
  <link rel="alternate icon" type="image/png" href="assets/img/favicon.png">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .join-viewport {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }
    .join-nav {
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }
    .join-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 4rem;
    }
    .join-card {
      background: var(--card-translucent, rgba(14, 22, 34, 0.88));
      border: 1px solid var(--card-border, rgba(71, 210, 201, 0.28));
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 45px rgba(71, 210, 201, 0.16), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 3.25rem 2.5rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      position: relative;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .join-card:hover {
      border-color: rgba(71, 210, 201, 0.45);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65), 0 0 55px rgba(71, 210, 201, 0.24), inset 0 1px 0 0 rgba(255, 255, 255, 0.14);
    }
    .server-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(71, 210, 201, 0.1);
      border: 1px solid rgba(71, 210, 201, 0.35);
      color: var(--accent, #47d2c9);
      padding: 0.55rem 1.4rem;
      border-radius: 999px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      letter-spacing: 0.5px;
      box-shadow: 0 0 16px rgba(71, 210, 201, 0.15);
    }
    .pulse-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      background: var(--accent, #47d2c9);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent, #47d2c9);
      animation: pulse 1.6s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 10px #47d2c9; }
      50% { opacity: 0.35; transform: scale(0.8); box-shadow: 0 0 4px #47d2c9; }
    }
    .btn-launch-glow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: linear-gradient(135deg, var(--accent-bright, #5adfd5) 0%, var(--accent, #47d2c9) 50%, var(--accent-deep, #20b2aa) 100%);
      color: var(--accent-ink, #022623);
      font-weight: 700;
      font-size: 1.05rem;
      padding: 1rem 2rem;
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.22s ease;
      box-shadow: 0 0 28px rgba(71, 210, 201, 0.45);
      width: 100%;
      margin-top: 1rem;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-launch-glow:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(71, 210, 201, 0.7);
      color: #011816;
    }
    .btn-secondary-dark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--edge, #263545);
      color: var(--text, #e6edf3);
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      margin-top: 0.75rem;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .btn-secondary-dark:hover {
      background: rgba(71, 210, 201, 0.08);
      border-color: rgba(71, 210, 201, 0.4);
      color: #ffffff;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <!-- Ambient procedural cyber backdrops -->
  <div class="z-bg-dots" aria-hidden="true"></div>
  <div class="z-orb z-orb-1" aria-hidden="true"></div>
  <div class="z-orb z-orb-2" aria-hidden="true"></div>

  <div class="join-viewport">
    <header class="join-nav">
      <a href="index.html" class="nav-brand" style="text-decoration: none;">
        <img class="brand-text" src="assets/img/zircon-title.svg" alt="Zircon" width="120" height="26">
      </a>
      <a href="downloads.html" class="nav-link" style="font-size: 0.9rem;">Get Zircon Launcher &rarr;</a>
    </header>

    <main class="join-container">
      <div class="join-card">
        <div style="margin-bottom: 1.5rem;">
          <img src="assets/img/zircon-icon.svg" alt="Zircon Icon" width="68" height="68" style="filter: drop-shadow(0 0 20px rgba(71, 210, 201, 0.65));">
        </div>

        <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; color: #ffffff; letter-spacing: -0.02em;">Join Minecraft Server</h1>
        <p style="color: var(--text-muted, #8b949e); font-size: 1rem; margin-bottom: 1.75rem; line-height: 1.5;">Connect directly with synced modpacks and high-speed asset verification via Zircon.</p>

        <div class="server-pill" id="serverAddressDisplay">
          <span class="pulse-dot"></span>
          <span id="serverText">Loading...</span>
        </div>

        <div id="statusNotice" style="color: var(--text-muted, #8b949e); font-size: 0.92rem; margin-bottom: 1.5rem;">
          Launching Zircon on your device...
        </div>

        <a id="btnDeepLink" class="btn-launch-glow" href="#">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          Open in Zircon Launcher
        </a>

        <button id="btnCopyIp" class="btn-secondary-dark" onclick="copyServerIp()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          Copy Server IP
        </button>

        <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--edge-soft, rgba(38, 53, 69, 0.55));">
          <p style="color: var(--text-muted, #8b949e); font-size: 0.9rem; margin-bottom: 0.6rem;">Don't have Zircon installed yet?</p>
          <a href="downloads.html" style="color: var(--accent, #47d2c9); text-decoration: none; font-weight: 600; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 0.35rem;">
            Download Zircon for Windows, macOS &amp; Linux &rarr;
          </a>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Extract server from path e.g. /s/emerald or query ?server=...
    function getServer() {
      const path = window.location.pathname;
      const match = path.match(/\/s\/([^\/\?#]+)/);
      if (match && match[1]) {
        return decodeURIComponent(match[1]);
      }
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('server') || 'emerald.zirconmc.net';
    }

    const server = getServer();
    const serverFormatted = server.includes('.') ? server : `${server}.zirconmc.net`;
    const deepLinkUrl = `zircon://join/${serverFormatted}`;

    document.getElementById('serverText').textContent = serverFormatted;
    document.getElementById('btnDeepLink').setAttribute('href', deepLinkUrl);

    // Auto-trigger deep link invocation on page load
    window.addEventListener('DOMContentLoaded', () => {
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = deepLinkUrl;
      document.body.appendChild(iframe);

      setTimeout(() => {
        document.getElementById('statusNotice').textContent = "If the launcher didn't open automatically, click the button above:";
      }, 1500);
    });

    function copyServerIp() {
      navigator.clipboard.writeText(serverFormatted).then(() => {
        const btn = document.getElementById('btnCopyIp');
        const orig = btn.innerHTML;
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#47d2c9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg> Copied to Clipboard!`;
        setTimeout(() => { btn.innerHTML = orig; }, 2000);
      });
    }
  </script>
</body>
</html>
