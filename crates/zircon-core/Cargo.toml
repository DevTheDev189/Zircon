[package]
name = "zircon-core"
version = "0.1.0"
edition = "2021"
description = "Shared domain for Zircon: models, hashes, archives, mod metadata, provider API clients"
license = "MIT"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
zip.workspace = true
toml.workspace = true
tar.workspace = true
lz4_flex.workspace = true
reqwest.workspace = true
url.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "io-util"] }
