[package]
name = "zircon-launcher"
version = "0.4.4"
edition = "2021"
description = "Zircon companion launcher: Tauri v2 shell + Vue 3 frontend over the Phase 4 launch engine (Microsoft auth, classpath resolver, sync engines, offline instances)"
license = "BSL-1.1"

[lib]
name = "zircon_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
zircon-core = { path = "../zircon-core" }

tokio = { workspace = true, features = ["full"] }
axum = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
chrono.workspace = true
url.workspace = true
open.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zip.workspace = true
tar.workspace = true
flate2.workspace = true
semver.workspace = true
base64.workspace = true
image.workspace = true
tauri = { workspace = true }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
zeroize = { version = "1.8", features = ["derive"] }
getrandom = "0.3"
futures-util = "0.3"
igd-next = "0.14"

# OS keychain backends for the persisted Microsoft session (see
# `auth::msa::MicrosoftAuthService`). Each platform uses its native store;
# the session also falls back to a protected file when the keychain is
# unavailable (headless CI, locked keychain, ...).
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
# Deterministic key construction in TOFU attestation tests.
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
