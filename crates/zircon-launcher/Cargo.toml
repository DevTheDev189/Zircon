[package]
name = "zircon-launcher"
version = "0.1.0"
edition = "2021"
description = "Zircon companion launcher: Tauri v2 shell + Vue 3 frontend over the Phase 4 launch engine (Microsoft auth, classpath resolver, sync engines, offline instances)"
license = "MIT"

[lib]
name = "zircon_launcher"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
zircon-core = { path = "../zircon-core" }

tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true }
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
chrono.workspace = true
url.workspace = true
open.workspace = true
tracing.workspace = true
zip.workspace = true
semver.workspace = true
base64.workspace = true
image.workspace = true
tauri = { workspace = true }
tauri-plugin-dialog = "2"
getrandom = "0.3"
futures-util = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
